<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock · Cake Design by Audrey</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #faf6f1;
      --rose: #e8c4b8;
      --rose-dark: #c4846e;
      --rose-deep: #9b5a47;
      --brown: #3d2214;
      --brown-light: #6b3d26;
      --gold: #c9a96e;
      --gold-light: #f0ddb8;
      --white: #ffffff;
      --text: #2c1a0e;
      --text-muted: #8a6e5e;
      --border: rgba(197,158,124,0.25);
      --ok: #5a8a5c; --ok-bg: #e8f2e9;
      --warn: #b8861a; --warn-bg: #fdf3dc;
      --out: #a03030; --out-bg: #faeaea;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--text); min-height: 100vh; }
    body::before { content: ''; position: fixed; inset: 0; background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c9a96e' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"); pointer-events: none; z-index: 0; }
    .wrap { position: relative; z-index: 1; max-width: 960px; margin: 0 auto; padding: 0 20px 60px; }
    header { padding: 36px 0 24px; display: flex; align-items: flex-end; justify-content: space-between; border-bottom: 1px solid var(--border); margin-bottom: 32px; }
    .brand-name { font-family: 'Playfair Display', serif; font-size: 28px; color: var(--brown); letter-spacing: -0.5px; }
    .brand-name span { font-style: italic; color: var(--rose-deep); }
    .brand-sub { font-size: 11px; color: var(--text-muted); letter-spacing: 0.12em; text-transform: uppercase; font-weight: 300; margin-top: 3px; }
    .sync-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); }
    .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
    .sync-dot.syncing { background: var(--warn); }
    .sync-dot.error { background: var(--out); }
    .btn-refresh { padding: 7px 16px; border-radius: 30px; border: 1px solid var(--border); background: var(--white); color: var(--brown-light); font-family: 'DM Sans', sans-serif; font-size: 12px; cursor: pointer; }
    .btn-refresh:hover { background: var(--gold-light); }
    .stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 28px; }
    .stat { background: var(--white); border: 1px solid var(--border); border-radius: 16px; padding: 18px 20px; position: relative; overflow: hidden; }
    .stat::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--gold); border-radius: 16px 16px 0 0; }
    .stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-muted); font-weight: 500; margin-bottom: 8px; }
    .stat-val { font-family: 'Playfair Display', serif; font-size: 32px; color: var(--brown); }
    .stat-val.ok { color: var(--ok); } .stat-val.warn { color: var(--warn); } .stat-val.out { color: var(--out); }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 24px; }
    .filter-btn { padding: 6px 14px; border-radius: 30px; border: 1px solid var(--border); background: var(--white); color: var(--text-muted); font-family: 'DM Sans', sans-serif; font-size: 12px; cursor: pointer; }
    .filter-btn:hover { border-color: var(--rose); color: var(--rose-deep); }
    .filter-btn.active { background: var(--brown); border-color: var(--brown); color: var(--cream); }
    .search-wrap { margin-left: auto; }
    .search-wrap input { padding: 8px 16px; border-radius: 30px; border: 1px solid var(--border); background: var(--white); font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text); width: 190px; outline: none; }
    .search-wrap input:focus { border-color: var(--rose-dark); }
    .add-toggle { display: flex; align-items: center; gap: 8px; padding: 9px 20px; border-radius: 30px; border: 1.5px dashed var(--rose); background: transparent; color: var(--rose-deep); font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500; cursor: pointer; }
    .add-toggle:hover { background: var(--rose); color: var(--white); border-style: solid; }
    .add-form-wrap { background: var(--white); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; display: none; flex-wrap: wrap; gap: 10px; align-items: center; }
    .add-form-wrap.open { display: flex; }
    .add-form-wrap input, .add-form-wrap select { padding: 8px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--cream); font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text); outline: none; }
    .add-form-wrap input { width: 160px; } .add-form-wrap select { width: 140px; }
    .btn-add { padding: 8px 20px; border-radius: 10px; border: none; background: var(--brown); color: var(--cream); font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; }
    .btn-cancel { padding: 8px 16px; border-radius: 10px; border: 1px solid var(--border); background: transparent; color: var(--text-muted); font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; }
    .section-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.15em; color: var(--text-muted); font-weight: 500; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
    .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .plaques-wrap { background: var(--white); border: 1px solid var(--border); border-radius: 20px; padding: 20px 24px; margin-bottom: 28px; }
    .plaques-grid { display: flex; flex-wrap: wrap; gap: 10px; }
    .plaque { background: var(--cream); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 82px; }
    .plaque.ok { border-top: 3px solid var(--ok); } .plaque.low { border-top: 3px solid var(--warn); } .plaque.out { border-top: 3px solid var(--out); }
    .plaque-size { font-family: 'Playfair Display', serif; font-size: 14px; color: var(--brown); }
    .plaque-ctrl { display: flex; align-items: center; gap: 5px; }
    .pq-btn { width: 24px; height: 24px; border-radius: 8px; border: 1px solid var(--border); background: var(--white); color: var(--brown); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .pq-btn:hover { background: var(--gold-light); }
    .pq-val { font-family: 'Playfair Display', serif; font-size: 16px; min-width: 22px; text-align: center; color: var(--brown); }
    .items-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(280px,1fr)); gap: 12px; }
    .card { background: var(--white); border: 1px solid var(--border); border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; transition: transform 0.15s; }
    .card:hover { transform: translateY(-2px); }
    .card.ok { border-left: 3px solid var(--ok); } .card.low { border-left: 3px solid var(--warn); } .card.out { border-left: 3px solid var(--out); }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .card-name { font-family: 'Playfair Display', serif; font-size: 15px; color: var(--brown); }
    .card-cat { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); background: var(--cream); padding: 3px 10px; border-radius: 20px; border: 1px solid var(--border); white-space: nowrap; }
    .card-ctrl { display: flex; align-items: center; gap: 10px; }
    .qty-btn { width: 30px; height: 30px; border-radius: 10px; border: 1px solid var(--border); background: var(--cream); color: var(--brown); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .qty-btn:hover { background: var(--gold-light); }
    .qty-val { font-family: 'Playfair Display', serif; font-size: 22px; min-width: 32px; text-align: center; color: var(--brown); }
    .unit-lbl { font-size: 12px; color: var(--text-muted); }
    .badge { font-size: 10px; padding: 3px 10px; border-radius: 20px; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; margin-left: auto; }
    .badge.ok { background: var(--ok-bg); color: var(--ok); } .badge.low { background: var(--warn-bg); color: var(--warn); } .badge.out { background: var(--out-bg); color: var(--out); }
    .card-note { display: flex; gap: 8px; }
    .note-input { flex: 1; font-size: 12px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--cream); color: var(--text-muted); font-family: 'DM Sans', sans-serif; outline: none; }
    .note-input:focus { border-color: var(--rose-dark); }
    .del-btn { font-size: 11px; padding: 5px 10px; border: 1px solid var(--border); border-radius: 8px; background: transparent; color: var(--text-muted); cursor: pointer; font-family: 'DM Sans', sans-serif; }
    .del-btn:hover { background: var(--out-bg); color: var(--out); }
    .empty { grid-column: 1/-1; text-align: center; padding: 3rem; color: var(--text-muted); font-family: 'Playfair Display', serif; font-style: italic; font-size: 16px; }
    .error-bar { background: var(--out-bg); color: var(--out); padding: 12px 16px; border-radius: 12px; font-size: 13px; margin-bottom: 16px; }
    @media(max-width:600px){ .stats{grid-template-columns:repeat(2,1fr);} header{flex-direction:column;align-items:flex-start;gap:16px;} }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand-name">Cake Design <span>by Audrey</span></div>
      <div class="brand-sub">Gestion du stock — atelier pâtisserie</div>
    </div>
    <div class="sync-row">
      <span class="sync-dot" id="sync-dot"></span>
      <span id="sync-status">Connexion...</span>
      <button class="btn-refresh" onclick="fetchData()">Actualiser</button>
    </div>
  </header>

  <div id="error-bar" class="error-bar" style="display:none;"></div>

  <div class="stats">
    <div class="stat"><div class="stat-label">Total produits</div><div class="stat-val" id="s-total">—</div></div>
    <div class="stat"><div class="stat-label">En stock</div><div class="stat-val ok" id="s-ok">—</div></div>
    <div class="stat"><div class="stat-label">Stock faible</div><div class="stat-val warn" id="s-low">—</div></div>
    <div class="stat"><div class="stat-label">Rupture</div><div class="stat-val out" id="s-out">—</div></div>
  </div>

  <div class="toolbar">
    <button class="filter-btn active" onclick="setFilter('all',this)">Tout</button>
    <button class="filter-btn" onclick="setFilter('ok',this)">En stock</button>
    <button class="filter-btn" onclick="setFilter('low',this)">Stock faible</button>
    <button class="filter-btn" onclick="setFilter('out',this)">Rupture</button>
    <button class="filter-btn" onclick="setFilter('Bases',this)">Bases</button>
    <button class="filter-btn" onclick="setFilter('Fruits',this)">Fruits</button>
    <button class="filter-btn" onclick="setFilter('Garnitures',this)">Garnitures</button>
    <button class="filter-btn" onclick="setFilter('Décoration',this)">Décoration</button>
    <button class="filter-btn" onclick="setFilter('Matériel',this)">Matériel</button>
    <button class="add-toggle" onclick="toggleAdd()">+ Ajouter un produit</button>
    <div class="search-wrap"><input type="text" placeholder="Rechercher..." oninput="setSearch(this.value)" /></div>
  </div>

  <div class="add-form-wrap" id="add-form">
    <input id="new-name" placeholder="Nom du produit" />
    <input id="new-unit" placeholder="Unité (kg, L, pcs...)" />
    <input id="new-qty" type="number" placeholder="Quantité" min="0" style="width:110px;" />
    <select id="new-cat">
      <option value="Bases">Bases</option>
      <option value="Fruits">Fruits</option>
      <option value="Garnitures">Garnitures</option>
      <option value="Décoration">Décoration</option>
      <option value="Matériel">Matériel</option>
    </select>
    <button class="btn-add" onclick="addItem()">Ajouter</button>
    <button class="btn-cancel" onclick="toggleAdd()">Annuler</button>
  </div>

  <div class="section-label">Plaques gâteau — épaisseur 12mm</div>
  <div class="plaques-wrap">
    <div class="plaques-grid" id="plaques-grid"><span style="font-size:13px;color:var(--text-muted)">Chargement...</span></div>
  </div>

  <div class="section-label">Ingrédients & matériel</div>
  <div class="items-grid" id="items-grid"><div class="empty">Chargement du stock...</div></div>
</div>

<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbxdrAsYOpDRKNZC-8NR104PcsKEPr_0EMzyOKj-1-A3h_bnQDtJW09ZXqhvS89NHWp6/exec';
const PLAQUES_SIZES=['10cm','15cm','20cm','25cm','30cm','35cm'];
let items=[],plaques={},currentFilter='all',currentSearch='',nextId=100;
function setSyncStatus(s,m){document.getElementById('sync-dot').className='sync-dot '+(s==='ok'?'':s);document.getElementById('sync-status').textContent=m;}
function showError(m){const b=document.getElementById('error-bar');b.textContent=m;b.style.display='block';setTimeout(()=>b.style.display='none',5000);}
function getStatus(q){const n=Number(q);if(n<=0)return'out';if(n<=2)return'low';return'ok';}
function getBadge(s){return s==='out'?'Rupture':s==='low'?'Faible':'OK';}
async function fetchData(){
  setSyncStatus('syncing','Synchronisation...');
  try{
    const res=await fetch(SCRIPT_URL+'?t='+Date.now());
    const raw=await res.json();
    if(!raw||raw.length<2){setSyncStatus('error','Sheet vide');return;}
    items=[];plaques={};let maxId=99;
    for(let i=1;i<raw.length;i++){
      const[id,name,cat,qty,unit,note]=raw[i];
      if(!id&&!name)continue;
      if(String(id).startsWith('PLAQUE_')){plaques[String(id).replace('PLAQUE_','')]={qty:Number(qty),rowIndex:i+1};}
      else{items.push({id,name,cat,qty:Number(qty),unit,note:note||'',rowIndex:i+1});if(Number(id)>maxId)maxId=Number(id);}
    }
    PLAQUES_SIZES.forEach(s=>{if(!plaques[s])plaques[s]={qty:0,rowIndex:null};});
    nextId=maxId+1;render();
    setSyncStatus('ok','Synchronisé · '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){setSyncStatus('error','Hors ligne');showError('Impossible de joindre Google Sheets.');}
}
async function postData(p){await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify(p)});}
async function updateRow(r,c,v){
  setSyncStatus('syncing','Sauvegarde...');
  try{await postData({action:'update',row:r,col:c,value:v});setSyncStatus('ok','Sauvegardé · '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}));}
  catch(e){setSyncStatus('error','Erreur');showError('Modification non sauvegardée.');}
}
async function changeQty(id,d){const it=items.find(i=>i.id==id);if(!it)return;it.qty=Math.max(0,it.qty+d);render();await updateRow(it.rowIndex,4,it.qty);}
async function changePlaque(sz,d){if(!plaques[sz])plaques[sz]={qty:0,rowIndex:null};plaques[sz].qty=Math.max(0,plaques[sz].qty+d);renderPlaques();if(plaques[sz].rowIndex)await updateRow(plaques[sz].rowIndex,4,plaques[sz].qty);}
async function updateNote(id,v){const it=items.find(i=>i.id==id);if(!it)return;it.note=v;await updateRow(it.rowIndex,6,v);}
async function addItem(){
  const name=document.getElementById('new-name').value.trim();
  const unit=document.getElementById('new-unit').value.trim()||'pcs';
  const qty=parseInt(document.getElementById('new-qty').value)||0;
  const cat=document.getElementById('new-cat').value;
  if(!name)return;
  setSyncStatus('syncing','Ajout...');
  try{await postData({action:'addRow',row:[nextId++,name,cat,qty,unit,'']});document.getElementById('new-name').value='';document.getElementById('new-unit').value='';document.getElementById('new-qty').value='';toggleAdd();await fetchData();}
  catch(e){showError("Impossible d'ajouter.");setSyncStatus('error','Erreur');}
}
async function deleteItem(id){if(!confirm('Supprimer ce produit ?'))return;items=items.filter(i=>i.id!=id);render();await fetchData();}
function updateStats(){document.getElementById('s-total').textContent=items.length;document.getElementById('s-ok').textContent=items.filter(i=>getStatus(i.qty)==='ok').length;document.getElementById('s-low').textContent=items.filter(i=>getStatus(i.qty)==='low').length;document.getElementById('s-out').textContent=items.filter(i=>getStatus(i.qty)==='out').length;}
function renderPlaques(){
  const g=document.getElementById('plaques-grid');g.innerHTML='';
  PLAQUES_SIZES.forEach(sz=>{
    const dt=plaques[sz]||{qty:0};const s=getStatus(dt.qty);
    const d=document.createElement('div');d.className='plaque '+s;
    d.innerHTML=`<div class="plaque-size">${sz}</div><div class="plaque-ctrl"><button class="pq-btn" onclick="changePlaque('${sz}',-1)">−</button><span class="pq-val">${dt.qty}</span><button class="pq-btn" onclick="changePlaque('${sz}',1)">+</button></div><span class="badge ${s}">${getBadge(s)}</span>`;
    g.appendChild(d);
  });
}
function renderItems(){
  const g=document.getElementById('items-grid');
  let f=items;
  if(currentSearch)f=f.filter(i=>i.name.toLowerCase().includes(currentSearch.toLowerCase()));
  if(currentFilter!=='all'){if(['ok','low','out'].includes(currentFilter))f=f.filter(i=>getStatus(i.qty)===currentFilter);else f=f.filter(i=>i.cat===currentFilter);}
  g.innerHTML='';
  if(!f.length){g.innerHTML='<div class="empty">Aucun produit trouvé...</div>';return;}
  f.forEach(it=>{
    const s=getStatus(it.qty);const c=document.createElement('div');c.className='card '+s;
    c.innerHTML=`<div class="card-top"><div class="card-name">${it.name}</div><span class="card-cat">${it.cat}</span></div><div class="card-ctrl"><button class="qty-btn" onclick="changeQty('${it.id}',-1)">−</button><span class="qty-val">${it.qty}</span><button class="qty-btn" onclick="changeQty('${it.id}',1)">+</button><span class="unit-lbl">${it.unit}</span><span class="badge ${s}">${getBadge(s)}</span></div><div class="card-note"><input class="note-input" placeholder="Ajouter une note..." value="${it.note||''}" onchange="updateNote('${it.id}',this.value)" /><button class="del-btn" onclick="deleteItem('${it.id}')">Suppr.</button></div>`;
    g.appendChild(c);
  });
}
function render(){updateStats();renderPlaques();renderItems();}
function setFilter(f,btn){currentFilter=f;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderItems();}
function setSearch(v){currentSearch=v;renderItems();}
function toggleAdd(){document.getElementById('add-form').classList.toggle('open');}
fetchData();
setInterval(fetchData,30000);
</script>
</body>
</html>
