<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock · Cake Design by Audrey</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #faf6f1; --rose: #e8c4b8; --rose-dark: #c4846e; --rose-deep: #9b5a47;
      --brown: #3d2214; --brown-light: #6b3d26; --gold: #c9a96e; --gold-light: #f0ddb8;
      --white: #ffffff; --text: #2c1a0e; --text-muted: #8a6e5e; --border: rgba(197,158,124,0.25);
      --ok: #5a8a5c; --ok-bg: #e8f2e9; --warn: #b8861a; --warn-bg: #fdf3dc; --out: #a03030; --out-bg: #faeaea;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--text); min-height: 100vh; }
    body::before { content: ''; position: fixed; inset: 0; background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c9a96e' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"); pointer-events: none; z-index: 0; }
    .wrap { position: relative; z-index: 1; max-width: 980px; margin: 0 auto; padding: 0 20px 60px; }
    header { padding: 36px 0 24px; display: flex; align-items: flex-end; justify-content: space-between; border-bottom: 1px solid var(--border); margin-bottom: 32px; flex-wrap: wrap; gap: 16px; }
    .brand-name { font-family: 'Playfair Display', serif; font-size: 28px; color: var(--brown); }
    .brand-name span { font-style: italic; color: var(--rose-deep); }
    .brand-sub { font-size: 11px; color: var(--text-muted); letter-spacing: 0.12em; text-transform: uppercase; font-weight: 300; margin-top: 3px; }
    .sync-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); }
    .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); transition: background 0.3s; }
    .sync-dot.syncing { background: var(--warn); } .sync-dot.error { background: var(--out); }
    .btn-refresh { padding: 7px 16px; border-radius: 30px; border: 1px solid var(--border); background: var(--white); color: var(--brown-light); font-family: 'DM Sans', sans-serif; font-size: 12px; cursor: pointer; }
    .btn-refresh:hover { background: var(--gold-light); }
    .stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 28px; }
    .stat { background: var(--white); border: 1px solid var(--border); border-radius: 16px; padding: 16px 20px; position: relative; overflow: hidden; }
    .stat::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--gold); border-radius: 16px 16px 0 0; }
    .stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-muted); font-weight: 500; margin-bottom: 6px; }
    .stat-val { font-family: 'Playfair Display', serif; font-size: 30px; color: var(--brown); }
    .stat-val.ok { color: var(--ok); } .stat-val.warn { color: var(--warn); } .stat-val.out { color: var(--out); }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 24px; }
    .filter-btn { padding: 6px 14px; border-radius: 30px; border: 1px solid var(--border); background: var(--white); color: var(--text-muted); font-family: 'DM Sans', sans-serif; font-size: 12px; cursor: pointer; transition: all 0.2s; }
    .filter-btn:hover { border-color: var(--rose); color: var(--rose-deep); }
    .filter-btn.active { background: var(--brown); border-color: var(--brown); color: var(--cream); }
    .add-toggle { padding: 9px 20px; border-radius: 30px; border: 1.5px dashed var(--rose); background: transparent; color: var(--rose-deep); font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
    .add-toggle:hover { background: var(--rose); color: var(--white); border-style: solid; }
    .search-wrap { margin-left: auto; }
    .search-wrap input { padding: 8px 16px; border-radius: 30px; border: 1px solid var(--border); background: var(--white); font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text); width: 190px; outline: none; }
    .search-wrap input:focus { border-color: var(--rose-dark); }
    .add-form-wrap { background: var(--white); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; display: none; flex-wrap: wrap; gap: 10px; align-items: center; }
    .add-form-wrap.open { display: flex; }
    .add-form-wrap input, .add-form-wrap select { padding: 8px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--cream); font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text); outline: none; }
    .add-form-wrap input { width: 160px; } .add-form-wrap select { width: 140px; }
    .btn-add { padding: 8px 20px; border-radius: 10px; border: none; background: var(--brown); color: var(--cream); font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; }
    .btn-cancel { padding: 8px 16px; border-radius: 10px; border: 1px solid var(--border); background: transparent; color: var(--text-muted); font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; }
    .section-block { margin-bottom: 32px; }
    .section-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .section-icon { font-size: 18px; }
    .section-title-text { font-family: 'Playfair Display', serif; font-size: 17px; color: var(--brown); }
    .section-line { flex: 1; height: 1px; background: var(--border); }
    .section-count { font-size: 11px; color: var(--text-muted); background: var(--cream); border: 1px solid var(--border); padding: 2px 10px; border-radius: 20px; }
    .plaques-type-wrap { margin-bottom: 16px; }
    .plaques-type-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); font-weight: 500; margin-bottom: 8px; padding-left: 2px; }
    .plaques-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .plaque { background: var(--white); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; align-items: center; gap: 7px; min-width: 88px; transition: transform 0.15s; }
    .plaque:hover { transform: translateY(-2px); }
    .plaque.ok { border-top: 3px solid var(--ok); } .plaque.low { border-top: 3px solid var(--warn); } .plaque.out { border-top: 3px solid var(--out); }
    .plaque-size { font-family: 'Playfair Display', serif; font-size: 13px; color: var(--brown); text-align: center; }
    .plaque-ctrl { display: flex; align-items: center; gap: 4px; }
    .pq-btn { width: 24px; height: 24px; border-radius: 8px; border: 1px solid var(--border); background: var(--cream); color: var(--brown); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
    .pq-btn:hover { background: var(--gold-light); }
    .pq-val { font-family: 'Playfair Display', serif; font-size: 16px; min-width: 22px; text-align: center; color: var(--brown); }
    .badge { font-size: 10px; padding: 2px 8px; border-radius: 20px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; }
    .badge.ok { background: var(--ok-bg); color: var(--ok); } .badge.low { background: var(--warn-bg); color: var(--warn); } .badge.out { background: var(--out-bg); color: var(--out); }
    .items-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(260px,1fr)); gap: 10px; }
    .card { background: var(--white); border: 1px solid var(--border); border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; transition: transform 0.15s; }
    .card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(61,34,20,0.06); }
    .card.ok { border-left: 3px solid var(--ok); } .card.low { border-left: 3px solid var(--warn); } .card.out { border-left: 3px solid var(--out); }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .card-name { font-family: 'Playfair Display', serif; font-size: 14px; color: var(--brown); line-height: 1.3; }
    .card-cat { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); background: var(--cream); padding: 2px 8px; border-radius: 20px; border: 1px solid var(--border); white-space: nowrap; }
    .card-ctrl { display: flex; align-items: center; gap: 8px; }
    .qty-btn { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--border); background: var(--cream); color: var(--brown); font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
    .qty-btn:hover { background: var(--gold-light); }
    .qty-val { font-family: 'Playfair Display', serif; font-size: 20px; min-width: 30px; text-align: center; color: var(--brown); }
    .unit-lbl { font-size: 12px; color: var(--text-muted); }
    .card-note { display: flex; gap: 6px; }
    .note-input { flex: 1; font-size: 12px; padding: 5px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--cream); color: var(--text-muted); font-family: 'DM Sans', sans-serif; outline: none; }
    .note-input:focus { border-color: var(--rose-dark); }
    .del-btn { font-size: 11px; padding: 4px 8px; border: 1px solid var(--border); border-radius: 8px; background: transparent; color: var(--text-muted); cursor: pointer; transition: all 0.15s; }
    .del-btn:hover { background: var(--out-bg); color: var(--out); }
    .empty { text-align: center; padding: 2rem; color: var(--text-muted); font-family: 'Playfair Display', serif; font-style: italic; font-size: 15px; }
    .error-bar { background: var(--out-bg); color: var(--out); padding: 12px 16px; border-radius: 12px; font-size: 13px; margin-bottom: 16px; }
    @media(max-width:600px){ .stats{grid-template-columns:repeat(2,1fr);} header{flex-direction:column;align-items:flex-start;} }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand-name">Cake Design <span>by Audrey</span></div>
      <div class="brand-sub">Gestion du stock — atelier pâtisserie</div>
    </div>
    <div class="sync-row">
      <span class="sync-dot" id="sync-dot"></span>
      <span id="sync-status">Connexion...</span>
      <button class="btn-refresh" onclick="fetchData()">Actualiser</button>
    </div>
  </header>

  <div id="error-bar" class="error-bar" style="display:none;"></div>

  <div class="stats">
    <div class="stat"><div class="stat-label">Total produits</div><div class="stat-val" id="s-total">—</div></div>
    <div class="stat"><div class="stat-label">En stock</div><div class="stat-val ok" id="s-ok">—</div></div>
    <div class="stat"><div class="stat-label">Stock faible</div><div class="stat-val warn" id="s-low">—</div></div>
    <div class="stat"><div class="stat-label">Rupture</div><div class="stat-val out" id="s-out">—</div></div>
  </div>

  <div class="toolbar">
    <button class="filter-btn active" onclick="setFilter('all',this)">Tout</button>
    <button class="filter-btn" onclick="setFilter('ok',this)">✅ En stock</button>
    <button class="filter-btn" onclick="setFilter('low',this)">⚠️ Faible</button>
    <button class="filter-btn" onclick="setFilter('out',this)">🔴 Rupture</button>
    <button class="filter-btn" onclick="setFilter('Bases',this)">Bases</button>
    <button class="filter-btn" onclick="setFilter('Fruits',this)">Fruits</button>
    <button class="filter-btn" onclick="setFilter('Garnitures',this)">Garnitures</button>
    <button class="filter-btn" onclick="setFilter('Décoration',this)">Décoration</button>
    <button class="filter-btn" onclick="setFilter('Matériel',this)">Matériel</button>
    <button class="add-toggle" onclick="toggleAdd()">+ Ajouter</button>
    <div class="search-wrap"><input type="text" placeholder="Rechercher..." oninput="setSearch(this.value)" /></div>
  </div>

  <div class="add-form-wrap" id="add-form">
    <input id="new-name" placeholder="Nom du produit" />
    <input id="new-unit" placeholder="Unité (kg, L, pcs...)" />
    <input id="new-qty" type="number" placeholder="Quantité" min="0" style="width:110px;" />
    <select id="new-cat">
      <option value="Bases">Bases</option>
      <option value="Fruits">Fruits</option>
      <option value="Garnitures">Garnitures</option>
      <option value="Décoration">Décoration</option>
      <option value="Matériel">Matériel</option>
    </select>
    <button class="btn-add" onclick="addItem()">Ajouter</button>
    <button class="btn-cancel" onclick="toggleAdd()">Annuler</button>
  </div>

  <!-- PLAQUES -->
  <div class="section-block">
    <div class="section-header">
      <span class="section-icon">🎂</span>
      <span class="section-title-text">Plaques gâteau — 12mm</span>
      <div class="section-line"></div>
    </div>
    <div class="plaques-type-wrap">
      <div class="plaques-type-label">⭕ Rondes</div>
      <div class="plaques-row" id="plaques-rondes"></div>
    </div>
    <div class="plaques-type-wrap">
      <div class="plaques-type-label">⬛ Carrées</div>
      <div class="plaques-row" id="plaques-carrees"></div>
    </div>
    <div class="plaques-type-wrap">
      <div class="plaques-type-label">▬ Rectangulaires</div>
      <div class="plaques-row" id="plaques-rect"></div>
    </div>
  </div>

  <!-- BOITES -->
  <div class="section-block">
    <div class="section-header">
      <span class="section-icon">📦</span>
      <span class="section-title-text">Boîtes gâteau</span>
      <div class="section-line"></div>
    </div>
    <div class="plaques-type-wrap">
      <div class="plaques-type-label">⬛ Carrées</div>
      <div class="plaques-row" id="boites-carrees"></div>
    </div>
    <div class="plaques-type-wrap">
      <div class="plaques-type-label">▬ Rectangulaires</div>
      <div class="plaques-row" id="boites-rect"></div>
    </div>
  </div>

  <!-- INGREDIENTS -->
  <div class="section-block">
    <div class="section-header">
      <span class="section-icon">🥣</span>
      <span class="section-title-text">Ingrédients</span>
      <div class="section-line"></div>
      <span class="section-count" id="count-ingredients">0</span>
    </div>
    <div class="items-grid" id="grid-ingredients"></div>
  </div>

  <!-- MATERIEL -->
  <div class="section-block">
    <div class="section-header">
      <span class="section-icon">🧰</span>
      <span class="section-title-text">Matériel & consommables</span>
      <div class="section-line"></div>
      <span class="section-count" id="count-materiel">0</span>
    </div>
    <div class="items-grid" id="grid-materiel"></div>
  </div>

  <!-- DECORATION -->
  <div class="section-block">
    <div class="section-header">
      <span class="section-icon">🎨</span>
      <span class="section-title-text">Décoration</span>
      <div class="section-line"></div>
      <span class="section-count" id="count-deco">0</span>
    </div>
    <div class="items-grid" id="grid-deco"></div>
  </div>

</div>
<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbxBMtiujofQcJxv69OLKG6cDbTljRudtTrs2TeQq-0jcbAU4KrPNys-o-nujWmthlRqgA/exec';
const PLAQUES_RONDES=['PLAQUE_ROND_10cm','PLAQUE_ROND_15cm','PLAQUE_ROND_20cm','PLAQUE_ROND_25cm','PLAQUE_ROND_30cm','PLAQUE_ROND_35cm'];
const PLAQUES_CARREES=['PLAQUE_CARRE_20','PLAQUE_CARRE_25','PLAQUE_CARRE_30','PLAQUE_CARRE_40'];
const PLAQUES_RECT=['PLAQUE_RECT_30x40','PLAQUE_RECT_35x50','PLAQUE_RECT_40x60','PLAQUE_RECT_45x65'];
const BOITES_CARREES=['BOITE_CARRE_20','BOITE_CARRE_30','BOITE_CARRE_40'];
const BOITES_RECT=['BOITE_RECT_30x40','BOITE_RECT_35x50','BOITE_RECT_40x60'];
const INGREDIENTS_CATS=['Bases','Fruits','Garnitures'];
const MATERIEL_CATS=['Matériel'];
const DECO_CATS=['Décoration'];
const LABELS={
  'PLAQUE_ROND_10cm':'10 cm','PLAQUE_ROND_15cm':'15 cm','PLAQUE_ROND_20cm':'20 cm','PLAQUE_ROND_25cm':'25 cm','PLAQUE_ROND_30cm':'30 cm','PLAQUE_ROND_35cm':'35 cm',
  'PLAQUE_CARRE_20':'20 cm','PLAQUE_CARRE_25':'25 cm','PLAQUE_CARRE_30':'30 cm','PLAQUE_CARRE_40':'40 cm',
  'PLAQUE_RECT_30x40':'30×40','PLAQUE_RECT_35x50':'35×50','PLAQUE_RECT_40x60':'40×60','PLAQUE_RECT_45x65':'45×65',
  'BOITE_CARRE_20':'20 cm','BOITE_CARRE_30':'30 cm','BOITE_CARRE_40':'40 cm',
  'BOITE_RECT_30x40':'30×40','BOITE_RECT_35x50':'35×50','BOITE_RECT_40x60':'40×60',
};
let allData={},regularItems=[],currentFilter='all',currentSearch='',nextId=100;
function setSyncStatus(s,m){document.getElementById('sync-dot').className='sync-dot '+(s==='ok'?'':s);document.getElementById('sync-status').textContent=m;}
function showError(m){const b=document.getElementById('error-bar');b.textContent=m;b.style.display='block';setTimeout(()=>b.style.display='none',5000);}
function getStatus(q){const n=Number(q);if(n<=0)return'out';if(n<=2)return'low';return'ok';}
function getBadge(s){return s==='out'?'Rupture':s==='low'?'Faible':'OK';}
async function fetchData(){
  setSyncStatus('syncing','Synchronisation...');
  try{
    const res=await fetch(SCRIPT_URL+'?t='+Date.now());
    const raw=await res.json();
    if(!raw||raw.length<2){setSyncStatus('error','Sheet vide');return;}
    allData={};regularItems=[];let maxId=99;
    for(let i=1;i<raw.length;i++){
      const[id,name,cat,qty,unit,note]=raw[i];
      if(!id&&!name)continue;
      const sid=String(id);
      if(sid.startsWith('PLAQUE_')||sid.startsWith('BOITE_')){
        allData[sid]={qty:Number(qty),rowIndex:i+1,name};
      }else{
        regularItems.push({id,name,cat,qty:Number(qty),unit,note:note||'',rowIndex:i+1});
        if(Number(id)>maxId)maxId=Number(id);
      }
    }
    nextId=maxId+1;render();
    setSyncStatus('ok','Synchronisé · '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){setSyncStatus('error','Hors ligne');showError('Impossible de joindre Google Sheets.');}
}
async function postData(p){await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify(p)});}
async function updateRow(r,c,v){
  setSyncStatus('syncing','Sauvegarde...');
  try{await postData({action:'update',row:r,col:c,value:v});setSyncStatus('ok','Sauvegardé · '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}));}
  catch(e){setSyncStatus('error','Erreur');showError('Modification non sauvegardée.');}
}
async function changeSpecial(id,delta){
  if(!allData[id])allData[id]={qty:0,rowIndex:null};
  allData[id].qty=Math.max(0,allData[id].qty+delta);
  renderPlaques();renderBoites();
  if(allData[id].rowIndex)await updateRow(allData[id].rowIndex,4,allData[id].qty);
}
async function changeQty(id,d){
  const it=regularItems.find(i=>i.id==id);if(!it)return;
  it.qty=Math.max(0,it.qty+d);renderRegular();
  await updateRow(it.rowIndex,4,it.qty);
}
async function updateNote(id,v){const it=regularItems.find(i=>i.id==id);if(!it)return;it.note=v;await updateRow(it.rowIndex,6,v);}
async function addItem(){
  const name=document.getElementById('new-name').value.trim();
  const unit=document.getElementById('new-unit').value.trim()||'pcs';
  const qty=parseInt(document.getElementById('new-qty').value)||0;
  const cat=document.getElementById('new-cat').value;
  if(!name)return;
  setSyncStatus('syncing','Ajout...');
  try{
    await postData({action:'addRow',row:[nextId++,name,cat,qty,unit,'']});
    document.getElementById('new-name').value='';document.getElementById('new-unit').value='';document.getElementById('new-qty').value='';
    toggleAdd();await fetchData();
  }catch(e){showError("Impossible d'ajouter.");setSyncStatus('error','Erreur');}
}
async function deleteItem(id){
  if(!confirm('Supprimer ce produit ?'))return;
  regularItems=regularItems.filter(i=>i.id!=id);renderRegular();await fetchData();
}
function updateStats(){
  document.getElementById('s-total').textContent=regularItems.length;
  document.getElementById('s-ok').textContent=regularItems.filter(i=>getStatus(i.qty)==='ok').length;
  document.getElementById('s-low').textContent=regularItems.filter(i=>getStatus(i.qty)==='low').length;
  document.getElementById('s-out').textContent=regularItems.filter(i=>getStatus(i.qty)==='out').length;
}
function renderGroup(containerEl,ids){
  containerEl.innerHTML='';
  ids.forEach(id=>{
    const dt=allData[id]||{qty:0,rowIndex:null};
    const s=getStatus(dt.qty);
    const d=document.createElement('div');d.className='plaque '+s;
    d.innerHTML=`<div class="plaque-size">${LABELS[id]||id}</div><div class="plaque-ctrl"><button class="pq-btn" onclick="changeSpecial('${id}',-1)">−</button><span class="pq-val">${dt.qty}</span><button class="pq-btn" onclick="changeSpecial('${id}',1)">+</button></div><span class="badge ${s}">${getBadge(s)}</span>`;
    containerEl.appendChild(d);
  });
}
function renderPlaques(){
  renderGroup(document.getElementById('plaques-rondes'),PLAQUES_RONDES);
  renderGroup(document.getElementById('plaques-carrees'),PLAQUES_CARREES);
  renderGroup(document.getElementById('plaques-rect'),PLAQUES_RECT);
}
function renderBoites(){
  renderGroup(document.getElementById('boites-carrees'),BOITES_CARREES);
  renderGroup(document.getElementById('boites-rect'),BOITES_RECT);
}
function renderGrid(gridEl,countEl,cats){
  let items=regularItems.filter(i=>cats.includes(i.cat));
  if(currentSearch)items=items.filter(i=>i.name.toLowerCase().includes(currentSearch.toLowerCase()));
  if(['ok','low','out'].includes(currentFilter))items=items.filter(i=>getStatus(i.qty)===currentFilter);
  else if(currentFilter!=='all'&&!cats.includes(currentFilter))items=[];
  if(countEl)countEl.textContent=items.length;
  gridEl.innerHTML='';
  if(!items.length){gridEl.innerHTML='<div class="empty">Aucun produit...</div>';return;}
  items.forEach(it=>{
    const s=getStatus(it.qty);const c=document.createElement('div');c.className='card '+s;
    c.innerHTML=`<div class="card-top"><div class="card-name">${it.name}</div><span class="card-cat">${it.cat}</span></div><div class="card-ctrl"><button class="qty-btn" onclick="changeQty('${it.id}',-1)">−</button><span class="qty-val">${it.qty}</span><button class="qty-btn" onclick="changeQty('${it.id}',1)">+</button><span class="unit-lbl">${it.unit}</span><span class="badge ${s}">${getBadge(s)}</span></div><div class="card-note"><input class="note-input" placeholder="Note..." value="${it.note||''}" onchange="updateNote('${it.id}',this.value)"/><button class="del-btn" onclick="deleteItem('${it.id}')">Suppr.</button></div>`;
    gridEl.appendChild(c);
  });
}
function renderRegular(){
  updateStats();
  renderGrid(document.getElementById('grid-ingredients'),document.getElementById('count-ingredients'),INGREDIENTS_CATS);
  renderGrid(document.getElementById('grid-materiel'),document.getElementById('count-materiel'),MATERIEL_CATS);
  renderGrid(document.getElementById('grid-deco'),document.getElementById('count-deco'),DECO_CATS);
}
function render(){renderPlaques();renderBoites();renderRegular();}
function setFilter(f,btn){currentFilter=f;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderRegular();}
function setSearch(v){currentSearch=v;renderRegular();}
function toggleAdd(){document.getElementById('add-form').classList.toggle('open');}
fetchData();
setInterval(fetchData,30000);
</script>
</body>
